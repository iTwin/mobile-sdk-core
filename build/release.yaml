trigger: none
pr: none

variables:
  - name: performingRelease
    value: true

resources:
  repositories:
    - repository: mobile-sdk-ios
      type: github
      name: iTwin/mobile-sdk-ios
      ref: main
      endpoint: iModelJs
    - repository: mobile-sdk-android
      type: github
      name: iTwin/mobile-sdk-android
      ref: main
      endpoint: iModelJs
    - repository: mobile-sdk-core
      type: github
      name: iTwin/mobile-sdk-core
      ref: main
      endpoint: iModelJs
    - repository: mobile-ui-react
      type: github
      name: iTwin/mobile-ui-react
      ref: main
      endpoint: iModelJs
    - repository: mobile-samples
      type: github
      name: iTwin/mobile-samples
      ref: main
      endpoint: iModelJs
    - repository: build-pipeline-scripts
      type: git
      name: iModelTechnologies/imodeljs-build-pipeline-scripts

stages:
- stage: Stage1
  displayName: newVersion stage1
  jobs:
    - job: Stage1Job
      displayName: newVersion stage1
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: mobile-sdk-ios
        - checkout: mobile-sdk-android
        - checkout: mobile-sdk-core
        - checkout: mobile-ui-react
        - checkout: mobile-samples

        - task: UseNode@1
          displayName: Use Node 20.x
          inputs:
            version: 20.x

        - task: UsePythonVersion@0
          inputs:
            versionSpec: 3.x

        - bash: |
            git config --global user.email 77415528+tcobbs-bentley@users.noreply.github.com
            git config --global user.name tcobbs-bentley
          displayName: Setup Git

        - task: PythonScript@0
          displayName: Stage1
          inputs:
            scriptSource: filePath
            scriptPath: $(Build.SourcesDirectory)/mobile-sdk-ios/newVersion.py
            arguments: stage1
          env:
            GH_TOKEN: $(GH_TOKEN)

- template: cd-stages-core.yaml

- stage: WaitForCoreNpmjs
  displayName: Wait for mobile-sdk-core on npmjs.org
  jobs:
    - job: WaitForCoreNpmjsJob
      displayName: Approve mobile-sdk-core availability
      pool: server
      timeoutInMinutes: 4320
      steps:
        - task: ManualValidation@0
          timeoutInMinutes: 4320
          inputs:
            notifyUsers: $(Build.RequestedForEmail)
            instructions: Verify that the newly published @itwin/mobile-sdk-core version is available on npmjs.org, then resume the release.
            onTimeout: reject

- stage: Stage2
  displayName: newVersion stage2
  jobs:
    - job: Stage2Job
      displayName: newVersion stage2
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
        - checkout: mobile-sdk-ios
        - checkout: mobile-sdk-android
        - checkout: mobile-ui-react
        - checkout: mobile-samples

        - task: UseNode@1
          displayName: Use Node 20.x
          inputs:
            version: 20.x

        - task: UsePythonVersion@0
          inputs:
            versionSpec: 3.x

        - bash: |
            git config --global user.email 77415528+tcobbs-bentley@users.noreply.github.com
            git config --global user.name tcobbs-bentley
          displayName: Setup Git

        - task: PythonScript@0
          displayName: Stage2
          inputs:
            scriptSource: filePath
            scriptPath: $(Build.SourcesDirectory)/mobile-sdk-ios/newVersion.py
            arguments: stage2
          env:
            GH_TOKEN: $(GH_TOKEN)

- template: build/cd-stages-ui-react.yaml@mobile-ui-react

- stage: WaitForUiReactNpmjs
  displayName: Wait for mobile-ui-react on npmjs.org
  jobs:
    - job: WaitForUiReactNpmjsJob
      displayName: Approve mobile-ui-react availability
      pool: server
      timeoutInMinutes: 4320
      steps:
        - task: ManualValidation@0
          timeoutInMinutes: 4320
          inputs:
            notifyUsers: $(Build.RequestedForEmail)
            instructions: Verify that the newly published @itwin/mobile-ui-react version is available on npmjs.org, then resume the release.
            onTimeout: reject

- stage: Stage3
  displayName: newVersion stage3
  jobs:
    - job: Stage3Job
      displayName: newVersion stage3
      pool:
        vmImage: ubuntu-latest
      steps:
        - checkout: self
        - checkout: mobile-sdk-ios
        - checkout: mobile-sdk-android
        - checkout: mobile-ui-react
        - checkout: mobile-samples

        - task: UseNode@1
          displayName: Use Node 20.x
          inputs:
            version: 20.x

        - task: UsePythonVersion@0
          inputs:
            versionSpec: 3.x

        - bash: |
            git config --global user.email 77415528+tcobbs-bentley@users.noreply.github.com
            git config --global user.name tcobbs-bentley
          displayName: Setup Git

        - task: PythonScript@0
          displayName: Stage3
          inputs:
            scriptSource: filePath
            scriptPath: $(Build.SourcesDirectory)/mobile-sdk-ios/newVersion.py
            arguments: stage3
          env:
            GH_TOKEN: $(GH_TOKEN)
